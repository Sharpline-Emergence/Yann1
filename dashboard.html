<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your map — Vivelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Interest tags on pillar cards — inline here since they're new;
     safe to move into css/style.css whenever you do a pass on it. */
  .pillar-card .interest-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pillar-card .interest-tag {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 50px;
    background: rgba(255,255,255,0.25);
    color: #fff;
  }
  .pillar-card .no-interests {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    margin-top: 10px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="topbar">
    <div class="brand">Vivelo</div>
    <button class="signout" id="signout-btn">Sign out</button>
  </div>

  <h2>Your life map</h2>
  <p class="helper-text" style="margin-bottom:20px;">Where you stand today across all four pillars.</p>

  <div class="pillar-grid" id="pillar-grid"></div>

  <div class="assistant-panel">
    <span class="ai-badge">AI assistant</span>
    <h3 style="font-size:17px; margin-bottom:6px;">Suggestions for you</h3>
    <p class="helper-text" id="assistant-intro">Based on where you're starting, here's where you might explore next.</p>
    <div id="suggestions"></div>
    <button class="btn btn-ghost mt-24" id="refresh-btn">Get new suggestions</button>
    <p class="msg" id="assistant-msg"></p>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js';
  import { requireSession, signOut } from './js/auth.js';

  const PILLAR_META = {
    purpose:     { label: 'Purpose',     color: '#C49A2E', bg: '#FEF3D0' },
    connections: { label: 'Connections', color: '#3A7FC1', bg: '#E3EEF9' },
    mind:        { label: 'Mind',        color: '#7B4FBB', bg: '#F0E8FA' },
    body:        { label: 'Body',        color: '#3D6B5E', bg: '#EAF2EF' },
  };

  document.getElementById('signout-btn').addEventListener('click', signOut);

  async function loadDashboard() {
    const session = await requireSession();
    if (!session) return;
    const userId = session.user.id;

    const { data: pillarRows, error } = await supabase
      .from('pillar_scores')
      .select('*')
      .eq('user_id', userId);

    if (error || !pillarRows || pillarRows.length === 0) {
      // No profile yet — send them to onboarding
      window.location.href = 'onboarding.html';
      return;
    }

    const grid = document.getElementById('pillar-grid');
    grid.innerHTML = '';
    pillarRows.forEach(row => {
      const meta = PILLAR_META[row.pillar];
      if (!meta) return;

      const interests = row.interests || [];
      const tagsHtml = interests.length
        ? `<div class="interest-tags">${interests.map(i => `<span class="interest-tag">${escapeHtml(i)}</span>`).join('')}</div>`
        : `<div class="no-interests">No activities added yet</div>`;

      const card = document.createElement('div');
      card.className = 'pillar-card';
      card.style.background = meta.color;
      card.innerHTML = `
        <div class="pillar-label">${meta.label}</div>
        <div class="pillar-score">${row.score}<span> / 10</span></div>
        ${tagsHtml}
      `;
      grid.appendChild(card);
    });

    await loadSuggestions(userId, pillarRows);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadSuggestions(userId, pillarRows) {
    const { data: existing } = await supabase
      .from('ai_suggestions')
      .select('*')
      .eq('user_id', userId)
      .order('created_at', { ascending: false })
      .limit(4);

    if (existing && existing.length > 0) {
      renderSuggestions(existing);
    } else {
      await fetchNewSuggestions(userId, pillarRows);
    }
  }

  function renderSuggestions(suggestions) {
    const box = document.getElementById('suggestions');
    box.innerHTML = suggestions.map(s => {
      const meta = PILLAR_META[s.pillar] || { label: s.pillar, color: '#666' };
      return `
        <div class="suggestion">
          <span class="pillar-tag" style="background:${meta.color}">${meta.label}</span>
          <div>${s.suggestion}</div>
        </div>`;
    }).join('');
  }

  async function fetchNewSuggestions(userId, pillarRows) {
    const msg = document.getElementById('assistant-msg');
    msg.textContent = 'Thinking…';
    msg.className = 'msg';

    // Calls the pillar-assistant Supabase Edge Function.
    // See supabase/functions/pillar-assistant/index.ts
    const { data, error } = await supabase.functions.invoke('pillar-assistant', {
      body: { pillars: pillarRows },
    });

    if (error) {
      msg.textContent = "Couldn't reach the assistant — the Edge Function may not be deployed yet.";
      msg.className = 'msg error';
      return;
    }

    msg.textContent = '';
    const rows = (data.suggestions || []).map(s => ({
      user_id: userId,
      pillar: s.pillar,
      suggestion: s.suggestion,
    }));
    if (rows.length) {
      await supabase.from('ai_suggestions').insert(rows);
    }
    renderSuggestions(rows.length ? rows : (data.suggestions || []));
  }

  document.getElementById('refresh-btn').addEventListener('click', async () => {
    const session = await requireSession();
    if (!session) return;
    const { data: pillarRows } = await supabase
      .from('pillar_scores')
      .select('*')
      .eq('user_id', session.user.id);
    await fetchNewSuggestions(session.user.id, pillarRows);
  });

  loadDashboard();
</script>
</body>
</html>
