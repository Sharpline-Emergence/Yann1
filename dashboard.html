<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your map — Vivelo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  #map-svg { width: 100%; height: auto; display: block; max-width: 800px; margin: 0 auto; }
  .pillar-label-text { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; }
  .theme-label-text { font-family: 'Inter', sans-serif; font-size: 10.5px; fill: #1A1F1C; paint-order: stroke; stroke: white; stroke-width: 3px; stroke-linejoin: round; }
  .retake-link { font-size: 13px; margin-top: 24px; display: inline-block; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin: 16px 0 8px; font-size: 13px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="topbar">
    <div class="brand">Vivelo</div>
    <button class="signout" id="signout-btn">Sign out</button>
  </div>

  <h2>Your life map</h2>
  <p class="helper-text" style="margin-bottom:12px;">Themes pulled from what you shared — position shows which pillars they connect.</p>

  <div class="legend" id="legend"></div>

  <svg id="map-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg"></svg>

  <p id="empty-state" class="helper-text" style="display:none; text-align:center;">
    No themes yet — <a href="onboarding.html">answer a few questions</a> to build your map.
  </p>

  <div style="text-align:center;">
    <a class="retake-link" href="onboarding.html">Retake the questionnaire →</a>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase-client.js';
  import { requireSession, signOut } from './js/auth.js';

  const CENTER = { x: 400, y: 400 };
  const OFFSET = 120;
  const BIG_R = 200;

  const PILLARS = {
    purpose:     { label: 'Purpose',     color: '#C49A2E', cx: CENTER.x,          cy: CENTER.y - OFFSET },
    mind:        { label: 'Mind',        color: '#7B4FBB', cx: CENTER.x + OFFSET, cy: CENTER.y },
    body:        { label: 'Body',        color: '#3D6B5E', cx: CENTER.x,          cy: CENTER.y + OFFSET },
    connections: { label: 'Connections', color: '#3A7FC1', cx: CENTER.x - OFFSET, cy: CENTER.y },
  };

  document.getElementById('signout-btn').addEventListener('click', signOut);

  // Legend
  document.getElementById('legend').innerHTML = Object.values(PILLARS).map(p => `
    <span class="legend-item"><span class="legend-dot" style="background:${p.color}"></span>${p.label}</span>
  `).join('');

  async function loadDashboard() {
    const session = await requireSession();
    if (!session) return;
    const userId = session.user.id;

    const { data: themes, error } = await supabase
      .from('user_themes')
      .select('*')
      .eq('user_id', userId);

    if (error || !themes || themes.length === 0) {
      const { data: responses } = await supabase
        .from('questionnaire_responses')
        .select('user_id')
        .eq('user_id', userId)
        .maybeSingle();

      if (!responses) {
        window.location.href = 'onboarding.html';
        return;
      }
      document.getElementById('map-svg').style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }

    renderMap(themes);
  }

  function weightRadius(w) {
    return w === 3 ? 32 : w === 2 ? 24 : 17;
  }

  function computeTargets(themes) {
    return themes.map(t => {
      const pillarKeys = (t.pillars || []).filter(p => PILLARS[p]);
      if (pillarKeys.length === 0) pillarKeys.push('mind'); // fallback, shouldn't normally happen

      let tx, ty;
      if (pillarKeys.length === 1) {
        // Single-pillar themes sit further out, inside their own pillar's territory,
        // away from the shared center — mirrors how the mockup floats single-interest
        // bubbles near the edge of their pillar rather than in the overlap zone.
        const p = PILLARS[pillarKeys[0]];
        tx = CENTER.x + (p.cx - CENTER.x) * 1.3;
        ty = CENTER.y + (p.cy - CENTER.y) * 1.3;
      } else {
        // Multi-pillar themes sit at the average of their linked pillars' centers —
        // naturally landing in the overlap region between those pillars.
        tx = pillarKeys.reduce((sum, k) => sum + PILLARS[k].cx, 0) / pillarKeys.length;
        ty = pillarKeys.reduce((sum, k) => sum + PILLARS[k].cy, 0) / pillarKeys.length;
      }

      // Small random jitter so identical-target themes don't start stacked exactly on
      // top of each other (which would break the collision-separation math below).
      tx += (Math.random() - 0.5) * 20;
      ty += (Math.random() - 0.5) * 20;

      return { ...t, tx, ty, x: tx, y: ty, r: weightRadius(t.weight) };
    });
  }

  function relax(nodes, iterations = 220) {
    for (let iter = 0; iter < iterations; iter++) {
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = a.r + b.r + 6;
          if (dist < minDist) {
            const overlap = (minDist - dist) / 2;
            const nx = dx / dist, ny = dy / dist;
            a.x -= nx * overlap; a.y -= ny * overlap;
            b.x += nx * overlap; b.y += ny * overlap;
          }
        }
      }
      // Gentle pull back toward each node's natural target position, so
      // separation doesn't let themes drift arbitrarily far from where
      // their pillar-membership actually places them.
      nodes.forEach(n => {
        n.x += (n.tx - n.x) * 0.015;
        n.y += (n.ty - n.y) * 0.015;
        n.x = Math.max(n.r + 5, Math.min(795 - n.r, n.x));
        n.y = Math.max(n.r + 5, Math.min(795 - n.r, n.y));
      });
    }
    return nodes;
  }

  function wrapLabel(label, maxCharsPerLine = 14) {
    const words = label.split(' ');
    const lines = [];
    let line = '';
    words.forEach(word => {
      if ((line + ' ' + word).trim().length > maxCharsPerLine && line) {
        lines.push(line.trim());
        line = word;
      } else {
        line = (line + ' ' + word).trim();
      }
    });
    if (line) lines.push(line);
    return lines.slice(0, 2); // cap at 2 lines to keep things readable
  }

  function renderMap(themes) {
    const svg = document.getElementById('map-svg');
    svg.innerHTML = '';
    const svgNS = 'http://www.w3.org/2000/svg';

    // Big pillar circles, drawn first so themes render on top.
    Object.entries(PILLARS).forEach(([key, p]) => {
      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', p.cx);
      circle.setAttribute('cy', p.cy);
      circle.setAttribute('r', BIG_R);
      circle.setAttribute('fill', p.color);
      circle.setAttribute('fill-opacity', '0.4');
      circle.style.mixBlendMode = 'multiply';
      svg.appendChild(circle);
    });

    // Pillar labels, positioned just outside each circle's outer edge.
    Object.entries(PILLARS).forEach(([key, p]) => {
      const dx = p.cx - CENTER.x, dy = p.cy - CENTER.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const labelX = p.cx + (dx / dist) * (BIG_R + 35);
      const labelY = p.cy + (dy / dist) * (BIG_R + 35);
      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', labelX);
      text.setAttribute('y', labelY);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('class', 'pillar-label-text');
      text.setAttribute('fill', p.color);
      text.textContent = p.label;
      svg.appendChild(text);
    });

    // Theme circles, positioned via geometry + collision relaxation.
    const nodes = relax(computeTargets(themes));
    nodes.forEach(n => {
      const g = document.createElementNS(svgNS, 'g');

      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', n.x);
      circle.setAttribute('cy', n.y);
      circle.setAttribute('r', n.r);
      circle.setAttribute('fill', '#2A3B4C');
      circle.setAttribute('fill-opacity', '0.88');
      g.appendChild(circle);

      const title = document.createElementNS(svgNS, 'title');
      const pillarNames = (n.pillars || []).map(p => PILLARS[p]?.label || p).join(', ');
      title.textContent = `${n.label} — ${pillarNames}`;
      g.appendChild(title);

      const lines = wrapLabel(n.label);
      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('x', n.x);
      text.setAttribute('y', n.y + n.r + 12);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('class', 'theme-label-text');
      lines.forEach((line, i) => {
        const tspan = document.createElementNS(svgNS, 'tspan');
        tspan.setAttribute('x', n.x);
        tspan.setAttribute('dy', i === 0 ? 0 : 12);
        tspan.textContent = line;
        text.appendChild(tspan);
      });
      g.appendChild(text);

      svg.appendChild(g);
    });
  }

  loadDashboard();
</script>
</body>
</html>
