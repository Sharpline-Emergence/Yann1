<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivelo — map your next chapter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .hero { text-align: center; padding: 60px 0 40px; }
  .hero p { color: var(--ink-soft); font-size: 16px; max-width: 360px; margin: 0 auto 28px; }
  .dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 32px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="wrap center">
  <div class="hero">
    <div class="dots">
      <span style="background:#C49A2E"></span>
      <span style="background:#3A7FC1"></span>
      <span style="background:#7B4FBB"></span>
      <span style="background:#3D6B5E"></span>
    </div>
    <h1 class="display">Vivelo</h1>
    <p>A living map of your Purpose, Connections, Mind, and Body — with an assistant that helps you find what's next.</p>
    <a href="login.html" class="btn btn-primary">Get started</a>
  </div>
  <p class="helper-text">Private test build for early feedback — thanks for trying it out.</p>
</div>
</body>
</html>
